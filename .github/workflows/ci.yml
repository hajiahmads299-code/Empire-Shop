name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma requires a syntactically valid URL for `validate`/`generate`.
  # No database is contacted during CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      # CI has no reachable database: `npm run build` would otherwise call
      # `prisma migrate deploy` against the placeholder DATABASE_URL and fail.
      - run: npm run build
        env:
          SKIP_DB_MIGRATE: '1'
